# Modelo Nginx para o Linux Manager. Ajuste se o painel ja gerencia sites/reverse proxy.
# Habilite primeiro HTTP, em seguida emita certificados HTTPS:
# sudo certbot --nginx -d www.aicorta.com.br -d api.aicorta.com.br -d aicorta.com.br --redirect
# Nao publique as portas 3000 e 3001 na Internet; os processos usam 127.0.0.1.

server {
  listen 80;
  server_name aicorta.com.br;
  return 301 https://www.aicorta.com.br$request_uri;
}

server {
  listen 80;
  server_name www.aicorta.com.br;

  client_max_body_size 2m;
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}

server {
  listen 80;
  server_name api.aicorta.com.br;

  client_max_body_size 2m;
  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
