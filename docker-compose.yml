services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aicorta
      POSTGRES_USER: aicorta
      POSTGRES_PASSWORD: aicorta_dev
    ports:
      - "5432:5432"
    volumes:
      - aicorta_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicorta -d aicorta"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  aicorta_pgdata:
